name: release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          ver="${VERSION#v}"
          ld="-s -w -X github.com/alttab8520/qqfarm-sdk/internal/version.Version=${ver}"
          GOOS=windows GOARCH=amd64 go build -ldflags "$ld" -o dist/qqfarm-sdk-windows-amd64.exe .
          GOOS=linux   GOARCH=amd64 go build -ldflags "$ld" -o dist/qqfarm-sdk-linux-amd64 .
          GOOS=darwin  GOARCH=amd64 go build -ldflags "$ld" -o dist/qqfarm-sdk-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -ldflags "$ld" -o dist/qqfarm-sdk-darwin-arm64 .
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: qqfarm-sdk ${{ github.ref_name }}
          body: |
            非官方 QQ 农场协议 HTTP SDK。
            启动后打开 http://127.0.0.1:8765/docs
          files: |
            dist/qqfarm-sdk-windows-amd64.exe
            dist/qqfarm-sdk-linux-amd64
            dist/qqfarm-sdk-darwin-amd64
            dist/qqfarm-sdk-darwin-arm64
          fail_on_unmatched_files: true
